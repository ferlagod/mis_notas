Categories:
  - Writing
License: GPL-3.0-or-later
AuthorName: ferlagod
SourceCode: https://github.com/ferlagod/mis_notas
IssueTracker: https://github.com/ferlagod/mis_notas/issues
Changelog: https://github.com/ferlagod/mis_notas/blob/HEAD/CHANGELOG.md

AutoName: Mis Notas

RepoType: git
Repo: https://github.com/ferlagod/mis_notas.git

Builds:
  - versionName: 1.0.0
    versionCode: 2
    commit: v1.0.0
    subdir: app
    sudo:
      # gradle/gradle-daemon-jvm.properties exige JDK 21 para el demonio de Gradle;
      # se instala aquí para que Gradle no intente descargarlo de foojay.io.
      - echo "deb https://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - update-alternatives --auto java
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 2
