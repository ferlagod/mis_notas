name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar almacén de claves
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "MISNOTAS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secret KEYSTORE_BASE64: el APK se publicará sin firmar."
          fi

      - name: Tests y APK release
        env:
          MISNOTAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MISNOTAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MISNOTAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Renombrar APK
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/MisNotas-${GITHUB_REF_NAME}$( [[ "$f" == *unsigned* ]] && echo -unsigned ).apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
